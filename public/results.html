<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Your PlateIQ Snapshot</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1a1a;--ink-s:#3d3d3d;--muted:#6b6b6b;--muted-l:#a0a0a0;--bg:#faf8f4;--card:#fff;--amber:#e8a020;--amber-d:#c47f0a;--amber-p:#fef3dc;--red:#dc2626;--red-p:#fef2f2;--green:#16a34a;--green-p:#f0fdf4;--border:rgba(26,26,26,.1);--border-m:rgba(26,26,26,.16);--r:10px;--r-lg:18px;--serif:"DM Serif Display",Georgia,serif;--sans:"Plus Jakarta Sans",system-ui,sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;}
nav{display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:64px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
.brand{font-family:var(--serif);font-size:20px;color:var(--ink);}
.brand span{color:var(--amber);}
.wrap{max-width:760px;margin:0 auto;padding:40px 24px 100px;}
/* Score section */
.score-wrap{text-align:center;padding:40px 0 32px;}
.score-circle{width:130px;height:130px;margin:0 auto 20px;position:relative;}
.score-circle svg{width:130px;height:130px;}
.ring-bg{fill:none;stroke:rgba(26,26,26,.08);stroke-width:10;}
.ring-fill{fill:none;stroke:var(--amber);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:65px 65px;transition:stroke-dashoffset 1.5s ease;}
.ring-num{font-family:var(--serif);font-size:32px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;}
.ring-den{font-size:12px;fill:var(--muted);text-anchor:middle;}
.score-label{font-family:var(--serif);font-size:22px;color:var(--ink);margin-bottom:6px;}
.score-sub{font-size:14px;color:var(--muted);max-width:480px;margin:0 auto;}
/* What we found banner */
.found-banner{background:var(--amber-p);border:1px solid rgba(232,160,32,.25);border-radius:var(--r);padding:12px 16px;font-size:13px;color:var(--amber-d);margin-bottom:24px;display:flex;align-items:flex-start;gap:8px;}
/* Insights */
.insights-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.insights-label::after{content:"";flex:1;height:1px;background:var(--border);}
.alert{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border-radius:var(--r);border-left:3px solid;margin-bottom:10px;}
.alert.critical{background:var(--red-p);border-color:var(--red);}
.alert.warning{background:var(--amber-p);border-color:var(--amber);}
.alert.positive{background:var(--green-p);border-color:var(--green);}
.alert-icon{font-size:18px;flex-shrink:0;margin-top:2px;}
.alert-title{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:3px;}
.alert-body{font-size:13px;color:var(--ink-s);line-height:1.55;}
.alert-impact{display:inline-block;font-size:11px;font-weight:700;margin-top:6px;padding:2px 10px;border-radius:99px;}
.alert.critical .alert-impact{background:rgba(220,38,38,.12);color:var(--red);}
.alert.warning  .alert-impact{background:rgba(232,160,32,.15);color:var(--amber-d);}
.alert.positive .alert-impact{background:rgba(22,163,74,.12);color:var(--green);}
/* Lock gate */
.lock-gate{position:relative;margin-top:24px;}
.lock-items{filter:blur(4px);pointer-events:none;user-select:none;}
.lock-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(250,248,244,.9);backdrop-filter:blur(3px);border-radius:var(--r-lg);padding:32px;text-align:center;z-index:10;}
.lock-title{font-family:var(--serif);font-size:22px;color:var(--ink);margin-bottom:8px;}
.lock-sub{font-size:13.5px;color:var(--muted);max-width:380px;margin:0 auto 24px;line-height:1.6;}
/* Plan cards inline */
.plan-row{display:flex;flex-direction:column;gap:10px;width:100%;max-width:440px;margin-bottom:20px;}
.plan-opt{border:2px solid var(--border-m);border-radius:var(--r-lg);padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;background:#fff;transition:border-color .12s;}
.plan-opt:hover{border-color:var(--amber);}
.plan-opt.selected{border-color:var(--amber);background:var(--amber-p);}
.plan-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-m);flex-shrink:0;transition:all .12s;}
.plan-opt.selected .plan-radio{border-color:var(--amber);background:var(--amber);}
.plan-info{flex:1;text-align:left;}
.plan-name{font-family:var(--serif);font-size:14px;color:var(--ink);}
.plan-desc{font-size:11.5px;color:var(--muted);}
.plan-price{font-family:var(--serif);font-size:18px;color:var(--ink);flex-shrink:0;}
.btn-unlock{font-family:var(--serif);font-size:16px;background:var(--ink);color:#fff;border:none;border-radius:var(--r);padding:14px 36px;cursor:pointer;transition:background .15s;}
.btn-unlock:hover{background:#2a2a2a;}
/* Locked teaser items */
.locked-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border-m);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;}
.locked-item-icon{font-size:16px;flex-shrink:0;}
.locked-item-title{font-size:13px;font-weight:600;color:var(--ink);}
.locked-item-sub{font-size:11.5px;color:var(--muted);}
/* Register form */
.reg-card{background:var(--card);border:1.5px solid var(--border-m);border-radius:var(--r-lg);padding:28px;margin-top:28px;display:none;}
.reg-title{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:4px;}
.reg-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}
.f-group{margin-bottom:14px;}
.f-group label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px;}
.f-group input{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--bg);border:1.5px solid var(--border-m);border-radius:var(--r);padding:11px 14px;outline:none;width:100%;transition:border-color .15s;}
.f-group input:focus{border-color:var(--amber);background:#fff;}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.btn-full{width:100%;font-family:var(--serif);font-size:16px;background:var(--ink);color:#fff;border:none;border-radius:var(--r);padding:14px;cursor:pointer;}
.btn-full:hover{background:#2a2a2a;}
.btn-full:disabled{opacity:.5;cursor:not-allowed;}
.form-err{font-size:13px;color:var(--red);margin-top:8px;display:none;}
.form-ok{font-size:13px;color:var(--green);margin-top:8px;display:none;}
.sign-in-link{font-size:13px;color:var(--muted);text-align:center;margin-top:12px;}
.sign-in-link a{color:var(--amber-d);font-weight:600;text-decoration:none;}
@media(max-width:640px){nav{padding:0 20px;}.wrap{padding:24px 16px 80px;}.f-row{grid-template-columns:1fr;}.plan-row{max-width:100%;}}
</style>
</head>
<body>
<nav>
  <div class="brand">Plate<span>IQ</span></div>
  <a href="/" style="font-size:13px;color:var(--muted);text-decoration:none;">&larr; Back</a>
</nav>

<div class="wrap" id="wrap">
  <div style="text-align:center;padding:60px;color:var(--muted);font-size:14px;">Loading your snapshot...</div>
</div>

<script>
var snap    = null;
var selPlan = 'growth';

function scoreColor(v) { return v >= 70 ? '#16a34a' : v >= 55 ? '#e8a020' : '#dc2626'; }

function buildPage(d) {
  var score = d.score || 60;
  var circ  = 2 * Math.PI * 52;
  var fill  = circ * score / 100;
  var off   = circ - fill;

  var scoreHtml =
    '<div class="score-wrap">' +
    '<div class="score-circle"><svg viewBox="0 0 130 130">' +
      '<circle class="ring-bg" cx="65" cy="65" r="52"/>' +
      '<circle class="ring-fill" cx="65" cy="65" r="52" stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" stroke="'+scoreColor(score)+'"/>' +
      '<text class="ring-num" x="65" y="61">'+score+'</text>' +
      '<text class="ring-den" x="65" y="79">/100</text>' +
    '</svg></div>' +
    '<div class="score-label">'+(d.scoreLabel||'Snapshot complete')+'</div>' +
    '<div class="score-sub">'+(d.scoreSub||'')+'</div>' +
    '</div>';

  var foundBanner = '<div class="found-banner">&#128269; <span>'+d.whatWeFound+'</span></div>';

  var insightsHtml = '<div class="insights-label">What we found</div>' +
    (d.freeInsights||[]).map(function(ins){
      return '<div class="alert '+(ins.type||'warning')+'">' +
        '<div class="alert-icon">'+(ins.icon||'')+'</div>' +
        '<div><div class="alert-title">'+ins.title+'</div>' +
        '<div class="alert-body">'+ins.body+'</div>' +
        (ins.impact?'<span class="alert-impact">'+ins.impact+'</span>':'')+'</div></div>';
    }).join('');

  // Locked items (blurred behind the overlay)
  var lockedItemsHtml = (d.lockedItems||[]).map(function(item){
    return '<div class="locked-item"><div class="locked-item-icon">'+item.icon+'</div>' +
      '<div><div class="locked-item-title">'+item.title+'</div></div></div>';
  }).join('');

  var planOpts = [
    {id:'starter', name:'Starter', desc:'Weekly report. You implement.', price:'£199/mo'},
    {id:'growth',  name:'Growth',  desc:'Monthly implementation by us.', price:'£499/mo'},
    {id:'partner', name:'Partner', desc:'Weekly managed changes + calls.', price:'£999/mo'},
  ];

  var plansHtml = '<div class="plan-row">' +
    planOpts.map(function(p){
      return '<div class="plan-opt'+(p.id===selPlan?' selected':'')+'" id="po-'+p.id+'" onclick="pickPlan(\'' + p.id + '\')">' +
        '<div class="plan-radio" id="pr-'+p.id+'"></div>' +
        '<div class="plan-info"><div class="plan-name">'+p.name+'</div><div class="plan-desc">'+p.desc+'</div></div>' +
        '<div class="plan-price">'+p.price+'</div>' +
      '</div>';
    }).join('') + '</div>';

  var lockGate =
    '<div class="lock-gate">' +
      '<div class="lock-items">'+lockedItemsHtml+'</div>' +
      '<div class="lock-overlay">' +
        '<div style="font-size:32px;margin-bottom:16px;">&#128274;</div>' +
        '<div class="lock-title">Get your full weekly report</div>' +
        '<div class="lock-sub">Choose a plan and we will log into your Uber Eats and Just Eat accounts, pull your real data, and generate your first full report within 48 hours.</div>' +
        plansHtml +
        '<button class="btn-unlock" onclick="showRegForm()">Continue with '+ucfirst(selPlan)+' plan &rarr;</button>' +
        '<div style="font-size:12px;color:var(--muted);margin-top:10px;">No commitment. Cancel anytime.</div>' +
      '</div>' +
    '</div>';

  document.getElementById('wrap').innerHTML = scoreHtml + foundBanner + insightsHtml + lockGate;

  // Append register form
  var regCard = document.createElement('div');
  regCard.id = 'regCard';
  regCard.className = 'reg-card';
  regCard.innerHTML =
    '<div class="reg-title">Create your account</div>' +
    '<div class="reg-sub">You will be taken to complete your setup and add your platform credentials after signing up.</div>' +
    '<div class="f-row">' +
      '<div class="f-group"><label>Email</label><input type="email" id="re-email" placeholder="you@restaurant.com"></div>' +
      '<div class="f-group"><label>Password</label><input type="password" id="re-pwd" placeholder="At least 6 characters"></div>' +
    '</div>' +
    '<button class="btn-full" onclick="register()" id="re-btn">Create account &amp; continue &rarr;</button>' +
    '<div class="form-err" id="re-err"></div>' +
    '<div class="form-ok"  id="re-ok"></div>' +
    '<div class="sign-in-link">Already have an account? <a href="/login">Sign in</a></div>';
  document.getElementById('wrap').appendChild(regCard);

  // Pre-fill email
  var storedEmail = sessionStorage.getItem('piq_email');
  if (storedEmail) { var el = document.getElementById('re-email'); if(el) el.value = storedEmail; }
}

function ucfirst(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function pickPlan(plan) {
  selPlan = plan;
  ['starter','growth','partner'].forEach(function(p){
    var opt = document.getElementById('po-'+p);
    if(opt) opt.classList.toggle('selected', p===plan);
  });
  // Update button text
  var btn = document.querySelector('.btn-unlock');
  if(btn) btn.textContent = 'Continue with '+ucfirst(plan)+' plan →';
}

function showRegForm() {
  var card = document.getElementById('regCard');
  if(card){ card.style.display='block'; card.scrollIntoView({behavior:'smooth',block:'center'}); }
}

async function register() {
  var email = (document.getElementById('re-email')||{}).value||'';
  var pwd   = (document.getElementById('re-pwd')||{}).value||'';
  var err   = document.getElementById('re-err');
  var ok    = document.getElementById('re-ok');
  err.style.display='none'; ok.style.display='none';
  if(!email||!email.includes('@')){ err.textContent='Please enter a valid email.'; err.style.display='block'; return; }
  if(!pwd||pwd.length<6){ err.textContent='Password must be at least 6 characters.'; err.style.display='block'; return; }
  var btn = document.getElementById('re-btn'); btn.disabled=true; btn.textContent='Creating account...';
  try {
    var res = await fetch('/api/register', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd})});
    var d   = await res.json();
    if(!d.ok) throw new Error(d.error);
    localStorage.setItem('piq_token', d.token);
    localStorage.setItem('piq_email', email);
    // Carry selected plan into onboarding
    try { var int = JSON.parse(localStorage.getItem('piq_interest')||'{}'); int.plan=selPlan; localStorage.setItem('piq_interest',JSON.stringify(int)); } catch(e){}
    ok.textContent = 'Account created! Taking you to setup...';
    ok.style.display='block';
    setTimeout(function(){ window.location.href='/onboarding'; }, 1000);
  } catch(e){
    err.textContent=e.message||'Could not create account.'; err.style.display='block';
    btn.disabled=false; btn.textContent='Create account & continue →';
  }
}

// Load from sessionStorage
window.addEventListener('DOMContentLoaded', function(){
  var raw = sessionStorage.getItem('piq_snapshot');
  if(!raw){ window.location.href='/'; return; }
  try{ snap=JSON.parse(raw); buildPage(snap); } catch(e){ window.location.href='/'; }
});
</script>
</body>
</html>
