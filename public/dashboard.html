<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard — PlateIQ</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1a1a;--ink-s:#3d3d3d;--muted:#6b6b6b;--muted-l:#a0a0a0;--bg:#faf8f4;--card:#fff;--amber:#e8a020;--amber-p:#fef3dc;--border:rgba(26,26,26,.1);--border-m:rgba(26,26,26,.16);--r:10px;--r-lg:18px;--serif:"DM Serif Display",Georgia,serif;--sans:"Plus Jakarta Sans",system-ui,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;}
nav{display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:64px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;}
.brand{font-family:var(--serif);font-size:20px;color:var(--ink);}
.brand span{color:var(--amber);}
.btn-logout{font-size:12.5px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;margin-left:16px;}
.wrap{max-width:900px;margin:0 auto;padding:40px 24px;}
.welcome{font-family:var(--serif);font-size:clamp(24px,4vw,36px);color:var(--ink);margin-bottom:4px;}
.welcome-sub{font-size:14px;color:var(--muted);margin-bottom:32px;}
.new-btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:13.5px;font-weight:700;background:var(--ink);color:#fff;text-decoration:none;border-radius:var(--r);padding:11px 22px;margin-bottom:36px;}
.sec-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.sec-label::after{content:"";flex:1;height:1px;background:var(--border);}
.reports-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.rc{background:var(--card);border:1px solid var(--border-m);border-radius:var(--r-lg);padding:20px;cursor:pointer;transition:box-shadow .15s;}
.rc:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);}
.rc-score{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.rc-num{font-family:var(--serif);font-size:32px;}
.rc-lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.rc-name{font-family:var(--serif);font-size:16px;color:var(--ink);margin-bottom:3px;}
.rc-meta{font-size:12px;color:var(--muted);}
.rc-date{font-size:11px;color:var(--muted-l);margin-top:10px;}
.empty{text-align:center;padding:60px 24px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);}
@media(max-width:640px){nav{padding:0 20px;}.wrap{padding:24px 16px;}}
</style>
</head>
<body>
<nav>
  <div class="brand">Plate<span>IQ</span></div>
  <div style="display:flex;align-items:center;">
    <span style="font-size:13px;color:var(--muted);" id="navEmail"></span>
    <button class="btn-logout" onclick="logout()">Sign out</button>
  </div>
</nav>
<div class="wrap">
  <div class="welcome">Welcome back.</div>
  <div class="welcome-sub">Your restaurant audits and reports.</div>
  <a href="/" class="new-btn">+ Run a new audit</a>
  <div class="sec-label">Your reports</div>
  <div id="reportsList"></div>
</div>
<script>
var token=localStorage.getItem('piq_token');
var email=localStorage.getItem('piq_email');
if(!token){window.location.href='/login';}
document.getElementById('navEmail').textContent=email||'';
function logout(){localStorage.removeItem('piq_token');localStorage.removeItem('piq_email');window.location.href='/';}
function scoreColor(v){return v>=70?'#16a34a':v>=55?'#e8a020':'#dc2626';}
function renderReports(reports){
  var el=document.getElementById('reportsList');
  if(!reports||!reports.length){
    el.innerHTML='<div class="empty"><div style="font-size:40px;margin-bottom:16px;">&#128202;</div><div style="font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:8px;">No reports yet</div><div style="font-size:13.5px;color:var(--muted);margin-bottom:20px;">Run your first free audit to see your restaurant performance breakdown.</div><a href="/" class="new-btn">Get my free audit</a></div>';
    return;
  }
  el.innerHTML='<div class="reports-grid">'+reports.map(function(r){
    var rd=r.report_data||{};
    var score=rd.score||0;
    var date=new Date(r.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    return '<div class="rc" onclick="viewReport(''+r.id+'')"><div class="rc-score"><div class="rc-num" style="color:'+scoreColor(score)+'">'+score+'</div><div class="rc-lbl">/100<br>'+(rd.scoreLabel||'')+'</div></div><div class="rc-name">'+(r.restaurant_name||'Restaurant')+'</div><div class="rc-meta">'+(r.city||'')+'</div><div class="rc-date">Audited '+date+'</div></div>';
  }).join('')+'</div>';
}
async function viewReport(id){
  var res=await fetch('/api/report/'+id,{headers:{'x-session-token':token}});
  var d=await res.json();
  if(d.ok&&d.report){
    var rd=d.report;
    sessionStorage.setItem('piq_report',JSON.stringify({report:rd.report_data,restaurantName:rd.restaurant_name,city:rd.city,cuisine:rd.cuisine,platforms:rd.platforms,url:rd.restaurant_url}));
    window.location.href='/report';
  }
}
fetch('/api/reports',{headers:{'x-session-token':token}})
  .then(function(r){return r.json();})
  .then(function(d){if(!d.ok){logout();return;}renderReports(d.reports);})
  .catch(function(){logout();});
</script>
</body>
</html>
