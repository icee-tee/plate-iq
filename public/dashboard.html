<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard - PlateIQ</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#1a1a1a;--ink-s:#3d3d3d;--muted:#6b6b6b;--muted-l:#a0a0a0;
  --bg:#faf8f4;--card:#fff;--amber:#e8a020;--amber-d:#c47f0a;--amber-p:#fef3dc;
  --red:#dc2626;--red-p:#fef2f2;--green:#16a34a;--green-p:#f0fdf4;
  --border:rgba(26,26,26,.1);--border-m:rgba(26,26,26,.16);
  --r:10px;--r-lg:18px;
  --serif:"DM Serif Display",Georgia,serif;
  --sans:"Plus Jakarta Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;}

/* Nav */
nav{display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
.brand{font-family:var(--serif);font-size:20px;color:var(--ink);}
.brand span{color:var(--amber);}
.nav-links{display:flex;align-items:center;gap:4px;}
.nav-link{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:var(--r);cursor:pointer;border:none;background:none;}
.nav-link.active,.nav-link:hover{color:var(--ink);background:var(--bg);}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-email{font-size:12px;color:var(--muted);}
.btn-logout{font-size:12px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;}

/* Page wrapper — full width */
.page{padding:32px 40px 80px;width:100%;}
.inner{width:100%;}

/* Header */
.dash-title{font-family:var(--serif);font-size:28px;color:var(--ink);margin-bottom:2px;}
.dash-sub{font-size:13px;color:var(--muted);}
.dash-week{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-top:4px;margin-bottom:24px;}

/* Platform tabs */
.plat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.plat-tab{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:7px 16px;border-radius:99px;border:2px solid var(--border-m);background:var(--card);color:var(--muted);cursor:pointer;transition:all .12s;}
.plat-tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.plat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
/* Week selector */
.week-selector{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.week-btn{font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:99px;border:1.5px solid var(--border-m);background:var(--card);color:var(--muted);cursor:pointer;}
.week-btn.active{background:var(--amber);border-color:var(--amber);color:var(--ink);}

/* Metric cards — 4 col, full width */
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.metric-card{background:var(--card);border:1px solid var(--border-m);border-radius:var(--r-lg);padding:18px 20px;}
.metric-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-l);margin-bottom:8px;}
.metric-value{font-family:var(--serif);font-size:28px;color:var(--ink);line-height:1;}
.metric-delta{font-size:12px;font-weight:600;margin-top:5px;}
.up{color:var(--green);} .down{color:var(--red);} .flat{color:var(--muted);}

/* Chart card — full width */
.chart-card{background:var(--card);border:1px solid var(--border-m);border-radius:var(--r-lg);padding:20px;margin-bottom:20px;}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.chart-title{font-family:var(--serif);font-size:16px;color:var(--ink);}
.chart-tabs{display:flex;gap:4px;}
.chart-tab{font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;border:1.5px solid var(--border-m);background:transparent;color:var(--muted);cursor:pointer;transition:all .12s;}
.chart-tab.active{background:var(--amber);border-color:var(--amber);color:var(--ink);}
.chart-container{position:relative;height:160px;width:100%;}

/* Two column below chart */
.two-col{display:grid;grid-template-columns:1fr 320px;gap:16px;}
.card{background:var(--card);border:1px solid var(--border-m);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;}
.card-title{font-family:var(--serif);font-size:17px;color:var(--ink);margin-bottom:4px;}
.card-sub{font-size:12px;color:var(--muted);margin-bottom:14px;}

/* Insights */
.alert{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:var(--r);border-left:3px solid;margin-bottom:10px;}
.alert.critical{background:var(--red-p);border-color:var(--red);}
.alert.warning{background:var(--amber-p);border-color:var(--amber);}
.alert.positive{background:var(--green-p);border-color:var(--green);}
.alert-icon{font-size:16px;flex-shrink:0;margin-top:2px;}
.alert-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:2px;}
.alert-body{font-size:12.5px;color:var(--ink-s);line-height:1.5;}

/* Checklist */
.section-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:8px;}
.chk-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--bg);border:1px solid var(--border);margin-bottom:6px;cursor:pointer;transition:background .1s;user-select:none;}
.chk-item:hover{background:#f0ede8;}
.chk-item.ticked{opacity:.65;}
.chk-item.ticked .chk-box{background:var(--green);border-color:var(--green);}
.chk-item.ticked .chk-text{text-decoration:line-through;color:var(--muted);}
.chk-box{width:18px;height:18px;min-width:18px;border-radius:4px;border:2px solid var(--border-m);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;margin-top:1px;transition:all .1s;}
.chk-text{font-size:13px;color:var(--ink-s);line-height:1.4;}
.chk-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:auto;white-space:nowrap;flex-shrink:0;}
.tag-now{background:var(--green-p);color:var(--green);}
.tag-soon{background:var(--amber-p);color:var(--amber-d);}

/* History sidebar */
.history-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.history-row:last-child{border-bottom:none;}
.history-row:hover .hw{color:var(--amber);}
.hw{font-size:13px;font-weight:600;color:var(--ink);transition:color .12s;}
.hm{font-size:11.5px;color:var(--muted);}

/* Contact */
.contact-textarea{width:100%;font-family:var(--sans);font-size:13.5px;border:1.5px solid var(--border-m);border-radius:var(--r);padding:10px 14px;resize:vertical;min-height:80px;background:var(--bg);color:var(--ink);outline:none;}
.contact-textarea:focus{border-color:var(--amber);background:#fff;}
.btn-send{font-family:var(--sans);font-size:13px;font-weight:700;background:var(--ink);color:#fff;border:none;border-radius:var(--r);padding:9px 20px;cursor:pointer;margin-top:8px;}

/* Account */
.acct-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);}
.acct-row:last-child{border-bottom:none;}
.acct-label{font-size:13px;font-weight:600;color:var(--ink);}
.acct-val{font-size:13px;color:var(--muted);}
.plan-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--amber-p);color:var(--amber-d);}
.btn-sm{font-size:12px;font-weight:700;padding:6px 14px;border-radius:var(--r);border:1.5px solid var(--border-m);background:transparent;color:var(--ink);cursor:pointer;}
.btn-sm.red{border-color:rgba(220,38,38,.3);color:var(--red);}

/* Empty / skeleton */
.empty{text-align:center;padding:60px 24px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);}
@keyframes sk{0%,100%{opacity:1}50%{opacity:.4}}
.sk{background:var(--border);border-radius:6px;animation:sk 1.5s ease-in-out infinite;}

@media(max-width:1024px){.two-col{grid-template-columns:1fr;}}
@media(max-width:768px){.metric-grid{grid-template-columns:repeat(2,1fr);}.page{padding:20px 16px;}.chart-header{flex-direction:column;align-items:flex-start;gap:8px;}nav{padding:0 16px;}}
@media(max-width:480px){.metric-grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<nav>
  <div class="brand">Plate<span>IQ</span></div>
  <div class="nav-links">
    <button class="nav-link active" id="tab-report"  onclick="showView('report')">Report</button>
    <button class="nav-link"        id="tab-account" onclick="showView('account')">Account</button>
  </div>
  <div class="nav-right">
    <span class="nav-email" id="navEmail"></span>
    <button class="btn-logout" onclick="logout()">Sign out</button>
  </div>
</nav>

<div class="page">
  <div class="inner" id="reportView"></div>
  <div class="inner" id="accountView" style="display:none;"></div>
</div>

<script>
var token    = localStorage.getItem('piq_token');
var email    = localStorage.getItem('piq_email');
var dashData = null;
var weekIdx  = 0;
var chartInst = null;

if (!token) window.location.href = '/login';
document.getElementById('navEmail').textContent = email || '';

function logout() {
  fetch('/api/logout',{method:'POST',headers:{'x-session-token':token}});
  localStorage.removeItem('piq_token'); localStorage.removeItem('piq_email');
  window.location.href = '/';
}

function showView(v) {
  document.getElementById('reportView').style.display  = v==='report'  ? 'block' : 'none';
  document.getElementById('accountView').style.display = v==='account' ? 'block' : 'none';
  document.getElementById('tab-report').classList.toggle('active',  v==='report');
  document.getElementById('tab-account').classList.toggle('active', v==='account');
}

function fmt(n)    { return Number(n||0).toLocaleString('en-GB'); }
function fmtGBP(n) { return '\u00a3' + Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function deltaHtml(val, isCurrency) {
  var v = Number(val||0);
  if (!v) return '<div class="metric-delta flat">\u2192 No change</div>';
  var cls = v>0 ? 'up' : 'down';
  var arr = v>0 ? '\u2191' : '\u2193';
  var str = isCurrency ? fmtGBP(Math.abs(v)) : fmt(Math.abs(v));
  return '<div class="metric-delta '+cls+'">'+arr+' '+str+' vs last week</div>';
}

// ── Checklist ─────────────────────────────────────────────────────────────────
function renderChecklist(containerId, thisWeek, longerTerm, weekEnding, plan) {
  var el = document.getElementById(containerId);
  if (!el) return;
  var key     = 'piq_chk_' + String(weekEnding).replace(/[^0-9]/g,'');
  var isSelf  = (!plan || plan === 'starter');
  var saved   = {};
  try { saved = JSON.parse(localStorage.getItem(key)||'{}'); } catch(e){}

  if (!thisWeek.length && !longerTerm.length) {
    el.innerHTML = '<div style="font-size:13px;color:var(--muted);">No actions for this week yet.</div>';
    return;
  }

  function makeItem(text, tagText, tagCls) {
    var id   = 'c' + text.replace(/[^a-zA-Z0-9]/g,'').slice(0,16);
    var done = !!saved[id];
    var div  = document.createElement('div');
    div.className = 'chk-item' + (done ? ' ticked' : '');
    div.id = id;
    div.innerHTML =
      '<div class="chk-box">' + (done ? '\u2713' : '') + '</div>' +
      '<div class="chk-text">' + text + '</div>' +
      '<span class="chk-tag ' + tagCls + '">' + tagText + '</span>';
    div.addEventListener('click', function() {
      var nowDone = !this.classList.contains('ticked');
      this.classList.toggle('ticked', nowDone);
      this.querySelector('.chk-box').innerHTML = nowDone ? '\u2713' : '';
      var s = {};
      try { s = JSON.parse(localStorage.getItem(key)||'{}'); } catch(e){}
      if (nowDone) s[this.id] = 1; else delete s[this.id];
      try { localStorage.setItem(key, JSON.stringify(s)); } catch(e){}
    });
    return div;
  }

  el.innerHTML = '';
  if (thisWeek.length) {
    var lbl1 = document.createElement('div');
    lbl1.className = 'section-lbl';
    lbl1.textContent = 'This week';
    el.appendChild(lbl1);
    thisWeek.forEach(function(a){ el.appendChild(makeItem(a, 'To do', 'tag-now')); });
  }
  if (longerTerm.length) {
    var lbl2 = document.createElement('div');
    lbl2.className = 'section-lbl';
    lbl2.style.marginTop = '12px';
    lbl2.textContent = 'Coming up';
    el.appendChild(lbl2);
    longerTerm.forEach(function(a){ el.appendChild(makeItem(a, 'Soon', 'tag-soon')); });
  }
}

// ── Chart ─────────────────────────────────────────────────────────────────────
function buildChart(history, metric) {
  if (!history || history.length < 2) return '';
  return '<div class="chart-card">' +
    '<div class="chart-header">' +
      '<div class="chart-title">Performance trend</div>' +
      '<div class="chart-tabs">' +
        ['orders','revenue','aov','rating'].map(function(m){
          var labels = {orders:'Orders',revenue:'Revenue',aov:'Avg order',rating:'Rating'};
          return '<button class="chart-tab'+(m===metric?' active':'')+'" onclick="switchMetric(this,\''+m+'\')">'+labels[m]+'</button>';
        }).join('') +
      '</div>' +
    '</div>' +
    '<div class="chart-container"><canvas id="perfChart"></canvas></div>' +
  '</div>';
}

function drawChart(history, metric) {
  var canvas = document.getElementById('perfChart');
  if (!canvas) return;
  var data   = history.slice(0,12).reverse();
  var labels = data.map(function(w){ return new Date(w.week_ending).toLocaleDateString('en-GB',{day:'numeric',month:'short'}); });
  var vals   = data.map(function(w){ return Number(w[metric]||0); });
  var isCurr = metric==='revenue'||metric==='aov';
  if (chartInst) { try { chartInst.destroy(); } catch(e){} chartInst = null; }
  // Small delay to let DOM settle after destroy
  chartInst = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        data: vals,
        backgroundColor: 'rgba(232,160,32,.25)',
        borderColor: '#e8a020',
        borderWidth: 2,
        borderRadius: 4,
        hoverBackgroundColor: 'rgba(232,160,32,.5)'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#a0a0a0' } },
        y: { grid: { color: 'rgba(26,26,26,.06)' }, ticks: { font: { size: 11 }, color: '#a0a0a0',
          callback: function(v){ return isCurr ? '\u00a3'+v : v; }
        }, beginAtZero: false }
      }
    }
  });
}

function switchMetric(btn, metric) {
  document.querySelectorAll('.chart-tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  var h = getActiveHistory(); if (h && h.length) drawChart(h,history||[], metric);
}

// ── Build report view ─────────────────────────────────────────────────────────
var activePlatform = 'all';

var platColors = {'Uber Eats':'#06c167','Just Eat':'#ff8000','Deliveroo':'#00ccbc','all':'#e8a020'};
var platLabels = {'Uber Eats':'Uber Eats','Just Eat':'Just Eat','Deliveroo':'Deliveroo','all':'All platforms'};

function buildPlatformTabs(platforms) {
  if (!platforms || !platforms.length) return '';
  var realPlats = platforms.filter(function(p){ return p !== 'all'; });
  if (realPlats.length <= 1) {
    if (realPlats.length === 1) activePlatform = realPlats[0];
    return ''; // Single platform — no tabs needed
  }
  // Multiple platforms — show All overview tab + individual tabs
  if (activePlatform !== 'all' && !realPlats.includes(activePlatform)) activePlatform = realPlats[0];
  var tabs = ['all'].concat(realPlats); // No 'All platforms' tab
  return '<div class="plat-tabs">' +
    tabs.map(function(p) {
      var color = platColors[p] || '#e8a020';
      return '<button class="plat-tab' + (p===activePlatform?' active':'') + '" data-plat="' + p + '" onclick="switchPlatformBtn(this)">' +
        (p!=='all'?'<span class="plat-dot" style="background:'+color+';"></span>':'') +
        platLabels[p] +
      '</button>';
    }).join('') +
  '</div>';
}

function switchPlatformBtn(btn) { switchPlatform(btn, btn.getAttribute('data-plat')); }
function switchPlatform(btn, platform) {
  activePlatform = platform;
  document.querySelectorAll('.plat-tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  weekIdx = 0;
  buildReportView(dashData);
}

function getActiveHistory() {
  if (!dashData) return [];
  var hbp = dashData.historyByPlatform || {};
  if (activePlatform === 'all') {
    // Combine real platforms: sum orders+revenue, average aov+rating
    var allWeeks = {};
    Object.keys(hbp).forEach(function(p) {
      if (p === 'all') return;
      (hbp[p]||[]).forEach(function(w) {
        var key = w.week_ending;
        if (!allWeeks[key]) allWeeks[key] = {week_ending:key, orders:0, revenue:0, _aovSum:0, _ratingSum:0, _count:0, report_data:w.report_data};
        allWeeks[key].orders   += Number(w.orders||0);
        allWeeks[key].revenue  += Number(w.revenue||0);
        allWeeks[key]._aovSum  += Number(w.aov||0);
        allWeeks[key]._ratingSum += Number(w.rating||0);
        allWeeks[key]._count   += 1;
      });
    });
    // If no per-platform data, fall back to 'all'
    if (!Object.keys(allWeeks).length) return hbp['all'] || [];
    return Object.values(allWeeks).map(function(w) {
      w.aov    = w._count ? (w._aovSum    / w._count).toFixed(2) : 0;
      w.rating = w._count ? (w._ratingSum / w._count).toFixed(2) : 0;
      return w;
    }).sort(function(a,b){ return b.week_ending > a.week_ending ? 1 : -1; });
  }
  return hbp[activePlatform] || [];
}

function buildReportView(data) {
  var rest      = data.restaurant;
  var platforms = data.platforms || ['all'];
  var plan      = data.user && data.user.plan;
  var history   = getActiveHistory();

  if (!rest) {
    document.getElementById('reportView').innerHTML =
      '<div class="empty"><div style="font-size:36px;margin-bottom:16px;">&#128197;</div>' +
      '<div style="font-family:var(--serif);font-size:22px;margin-bottom:8px;">Setup not complete</div>' +
      '<div style="font-size:13.5px;color:var(--muted);margin-bottom:20px;">Complete your account setup to get started.</div>' +
      '<a href="/onboarding" style="display:inline-block;font-family:var(--sans);font-size:14px;font-weight:700;background:var(--ink);color:#fff;text-decoration:none;border-radius:var(--r);padding:11px 24px;">Complete setup \u2192</a></div>';
    return;
  }

  var idx  = Math.min(weekIdx, Math.max(0, history.length-1));
  var week = history[idx] || {};
  var rep  = week.report_data || null;
  var sc   = rep ? rep.scorecard : null;

  // Platform tabs
  var platTabsHtml = buildPlatformTabs(platforms);

  // Week selector
  var weekSel = history.length > 1 ?
    '<div class="week-selector">' +
    history.map(function(w,i){
      var lbl = 'w/e '+new Date(w.week_ending).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
      return '<button class="week-btn'+(i===idx?' active':'')+'" onclick="selectWeek('+i+')">'+lbl+'</button>';
    }).join('')+'</div>' : '';

  // Metrics
  var metricsHtml = '';
  if (sc) {
    metricsHtml = '<div class="metric-grid">' +
      '<div class="metric-card"><div class="metric-label">Orders</div><div class="metric-value">'+fmt(sc.orders.value)+'</div>'+deltaHtml(sc.orders.delta,false)+'</div>' +
      '<div class="metric-card"><div class="metric-label">Revenue</div><div class="metric-value">'+fmtGBP(sc.revenue.value)+'</div>'+deltaHtml(sc.revenue.delta,true)+'</div>' +
      '<div class="metric-card"><div class="metric-label">Avg order value</div><div class="metric-value">'+fmtGBP(sc.aov.value)+'</div>'+deltaHtml(sc.aov.delta,true)+'</div>' +
      '<div class="metric-card"><div class="metric-label">Rating</div><div class="metric-value">'+sc.rating.value+'</div>'+deltaHtml(sc.rating.delta,false)+'</div>' +
    '</div>';
  } else if (week.orders) {
    // Compute deltas from history even without AI report
    var prevW = history[idx+1] || null;
    var od = prevW ? Number(week.orders) - Number(prevW.orders) : 0;
    var rd = prevW ? Number(week.revenue) - Number(prevW.revenue) : 0;
    var ad = prevW ? Number(week.aov) - Number(prevW.aov) : 0;
    var gd = prevW ? Number(week.rating) - Number(prevW.rating) : 0;
    metricsHtml = '<div class="metric-grid">' +
      '<div class="metric-card"><div class="metric-label">Orders</div><div class="metric-value">'+fmt(week.orders)+'</div>'+deltaHtml(od,false)+'</div>' +
      '<div class="metric-card"><div class="metric-label">Revenue</div><div class="metric-value">'+fmtGBP(week.revenue)+'</div>'+deltaHtml(rd,true)+'</div>' +
      '<div class="metric-card"><div class="metric-label">Avg order value</div><div class="metric-value">'+fmtGBP(week.aov)+'</div>'+deltaHtml(ad,true)+'</div>' +
      '<div class="metric-card"><div class="metric-label">Rating</div><div class="metric-value">'+(week.rating||'--')+'</div>'+deltaHtml(gd,false)+'</div>' +
    '</div>';
  }

  // Chart
  var chartHtml = buildChart(history, 'orders');

  // Insights
  var insightsHtml = '';
  if (rep && rep.insights) {
    insightsHtml = rep.insights.map(function(ins){
      return '<div class="alert '+(ins.type||'warning')+'">' +
        '<div class="alert-icon">'+(ins.icon||'')+'</div>' +
        '<div><div class="alert-title">'+ins.title+'</div><div class="alert-body">'+ins.body+'</div></div></div>';
    }).join('');
  }

  // History sidebar
  var histHtml = history.length > 1 ? '<div class="card">' +
    '<div class="card-title">Report history</div>' +
    '<div class="card-sub">Click any week to view</div>' +
    history.map(function(w,i){
      return '<div class="history-row" onclick="selectWeek('+i+')">' +
        '<div><div class="hw">w/e '+new Date(w.week_ending).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+'</div>' +
        '<div class="hm">'+fmt(w.orders)+' orders &middot; '+fmtGBP(w.revenue)+'</div></div>' +
        '<span style="font-size:11px;color:'+(w.report_data?'var(--green)':'var(--muted-l)')+';">'+(w.report_data?'\u2713 Report':'Pending')+'</span>' +
      '</div>';
    }).join('')+'</div>' : '';

  // No data yet
  var noDataBanner = !history.length ?
    '<div style="background:var(--amber-p);border:1px solid rgba(232,160,32,.3);border-radius:var(--r);padding:14px 18px;display:flex;gap:12px;align-items:flex-start;margin-bottom:20px;">' +
    '<span style="font-size:20px;">&#128338;</span>' +
    '<div><div style="font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:2px;">Your first report is being prepared</div>' +
    '<div style="font-size:13px;color:var(--amber-d);">Our team will log into your account within 48 hours and generate your first weekly report. We will email you when it is ready.</div></div></div>' : '';

  // Build task counter for all-platforms view
  var allTasksTotal = 0, allTasksDone = 0;
  if (activePlatform === 'all' && dashData && dashData.historyByPlatform) {
    Object.keys(dashData.historyByPlatform).forEach(function(p) {
      if (p === 'all') return;
      var platHistory = dashData.historyByPlatform[p] || [];
      var latestWeek = platHistory[0] || {};
      var platRep = latestWeek.report_data;
      if (platRep && platRep.thisWeekActions) {
        var key = 'piq_chk_' + String(latestWeek.week_ending||'').replace(/[^0-9]/g,'') + '_' + p;
        var saved = {};
        try { saved = JSON.parse(localStorage.getItem(key)||'{}'); } catch(e){}
        platRep.thisWeekActions.forEach(function(a){
          allTasksTotal++;
          var id = 'c' + a.replace(/[^a-zA-Z0-9]/g,'').slice(0,16);
          if (saved[id]) allTasksDone++;
        });
        (platRep.longerTermActions||[]).forEach(function(a){
          allTasksTotal++;
          var id = 'c' + a.replace(/[^a-zA-Z0-9]/g,'').slice(0,16);
          if (saved[id]) allTasksDone++;
        });
      }
    });
  }

  var allPlatOverview = activePlatform === 'all' ? (
    '<div class="two-col">' +
      '<div>' +
        (allTasksTotal > 0 ?
          '<div class="card" style="margin-bottom:16px;">' +
            '<div class="card-title">Tasks this week</div>' +
            '<div class="card-sub">Across all platforms</div>' +
            '<div style="display:flex;align-items:center;gap:16px;margin-top:8px;">' +
              '<div style="font-family:var(--serif);font-size:40px;color:var(--amber);">'+allTasksDone+'/'+allTasksTotal+'</div>' +
              '<div>' +
                '<div style="font-size:13px;font-weight:600;color:var(--ink);">'+allTasksDone+' completed</div>' +
                '<div style="font-size:12px;color:var(--muted);">'+(allTasksTotal-allTasksDone)+' remaining</div>' +
                '<div style="margin-top:8px;height:6px;background:var(--border);border-radius:99px;overflow:hidden;width:160px;">' +
                  '<div style="height:100%;background:var(--amber);border-radius:99px;width:'+(allTasksTotal?Math.round(allTasksDone/allTasksTotal*100):0)+'%;transition:width .6s;"></div>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' : '') +
        '<div class="card">' +
          '<div class="card-title">Platform overview</div>' +
          '<div class="card-sub">Review each platform tab for full analysis, checklist, and recommendations</div>' +
          '<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">' +
            Object.keys(dashData.historyByPlatform||{}).filter(function(p){return p!=='all';}).map(function(p){
              var col = platColors[p]||'#e8a020';
              var lbl = platLabels[p]||p;
              var ph = (dashData.historyByPlatform[p]||[])[0]||{};
              return '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-radius:var(--r);border:1px solid var(--border);">' +
                '<div style="display:flex;align-items:center;gap:8px;"><span style="width:10px;height:10px;border-radius:50%;background:'+col+';flex-shrink:0;display:inline-block;"></span><span style="font-size:13px;font-weight:600;color:var(--ink);">'+lbl+'</span></div>' +
                '<div style="font-size:12px;color:var(--muted);">'+(ph.orders?fmt(ph.orders)+' orders':'No data yet')+'</div>' +
              '</div>';
            }).join('') +
          '</div>' +
        '</div>' +
        '<div class="card" style="margin-top:16px;">' +
          '<div class="card-title">Contact us</div>' +
          '<div class="card-sub">Send us a message &mdash; we respond within a few hours</div>' +
          '<textarea id="contactMsg" class="contact-textarea" placeholder="Ask us anything..."></textarea>' +
          '<button class="btn-send" onclick="sendMsg()">Send message</button>' +
          '<div id="msgStatus" style="font-size:12.5px;margin-top:6px;display:none;"></div>' +
        '</div>' +
      '</div>' +
      '<div>'+histHtml+'</div>' +
    '</div>'
  ) : (
    '<div class="two-col">' +
      '<div>' +
        (rep ? '<div class="card">' +
          '<div class="card-title">'+(rep.headline||'Weekly analysis')+'</div>' +
          '<div style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6;">'+(rep.summary||'')+'</div>' +
          insightsHtml + '</div>' : '') +
        '<div class="card">' +
          '<div class="card-title">Action checklist</div>' +
          '<div class="card-sub">Tick off as you or our team complete each action</div>' +
          '<div id="chkContainer"></div>' +
        '</div>' +
        '<div class="card" style="margin-top:16px;">' +
          '<div class="card-title">Contact us</div>' +
          '<div class="card-sub">Send us a message &mdash; we respond within a few hours</div>' +
          '<textarea id="contactMsg" class="contact-textarea" placeholder="Ask us anything about your listing, report, or account..."></textarea>' +
          '<button class="btn-send" onclick="sendMsg()">Send message</button>' +
          '<div id="msgStatus" style="font-size:12.5px;margin-top:6px;display:none;"></div>' +
        '</div>' +
      '</div>' +
      '<div>'+histHtml+'</div>' +
    '</div>'
  );

  document.getElementById('reportView').innerHTML =
    platTabsHtml +
    '<div class="dash-title">'+(rest.name||'')+'</div>' +
    '<div class="dash-sub">'+(rest.postcode||'')+' \u00b7 '+(rest.platforms||'')+(activePlatform!=='all'?' \u00b7 '+platLabels[activePlatform]:'' )+'</div>' +
    (week.week_ending ? '<div class="dash-week">Week ending '+new Date(week.week_ending).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div>' : '<div style="height:8px;"></div>') +
    noDataBanner +
    weekSel +
    metricsHtml +
    chartHtml +
    allPlatOverview;

  if (activePlatform !== 'all') renderChecklist('chkContainer', rep&&rep.thisWeekActions||[], rep&&rep.longerTermActions||[], week.week_ending, plan);
  if (history.length >= 1) setTimeout(function(){ drawChart(history,'orders'); }, 50);
}

function selectWeek(i) {
  weekIdx = i;
  buildReportView(dashData);
}

// ── Account view ──────────────────────────────────────────────────────────────
function buildAccountView(data) {
  var user = data.user || {};
  var rest = data.restaurant;
  var plan = user.plan || 'none';
  var status = user.plan_status || 'inactive';
  var planLabels = {starter:'Starter \u2014 \u00a3199/mo',growth:'Growth \u2014 \u00a3499/mo',partner:'Partner \u2014 \u00a3999/mo',none:'No active plan'};
  document.getElementById('accountView').innerHTML =
    '<div class="dash-title">Account</div><div class="dash-sub" style="margin-bottom:28px;">Manage your plan and settings</div>' +
    '<div class="card" style="max-width:600px;margin-bottom:16px;">' +
      '<div class="card-title" style="margin-bottom:16px;">Your plan</div>' +
      '<div class="acct-row"><div><div class="acct-label">Current plan</div></div><span class="plan-badge">'+(planLabels[plan]||plan)+'</span></div>' +
      '<div class="acct-row"><div class="acct-label">Status</div><div class="acct-val" style="color:'+(status==='active'?'var(--green)':'var(--red)')+';">'+(status==='active'?'Active':'Inactive')+'</div></div>' +
      '<div class="acct-row"><div class="acct-label">Email</div><div class="acct-val">'+(user.email||email)+'</div></div>' +
      (plan!=='none'&&status==='active'?'<div class="acct-row"><div class="acct-label">Cancel</div><button class="btn-sm red" onclick="cancelSub()">Cancel at period end</button></div>':'') +
    '</div>' +
    (rest?'<div class="card" style="max-width:600px;">' +
      '<div class="card-title" style="margin-bottom:16px;">Restaurant</div>' +
      '<div class="acct-row"><div class="acct-label">Name</div><div class="acct-val">'+rest.name+'</div></div>' +
      '<div class="acct-row"><div class="acct-label">Postcode</div><div class="acct-val">'+rest.postcode+'</div></div>' +
      '<div class="acct-row"><div class="acct-label">Cuisine</div><div class="acct-val">'+(rest.cuisine||'\u2014')+'</div></div>' +
      '<div class="acct-row"><div class="acct-label">Platforms</div><div class="acct-val">'+rest.platforms+'</div></div>' +
      '<div class="acct-row"><div class="acct-label">Update details</div><a href="/onboarding" class="btn-sm">Update</a></div>' +
    '</div>':'');
}

async function cancelSub() {
  if (!confirm('Cancel your subscription? You keep access until end of billing period.')) return;
  var r = await fetch('/api/cancel-subscription',{method:'POST',headers:{'x-session-token':token}});
  var d = await r.json();
  alert(d.ok ? 'Cancelled. You keep access until period end.' : (d.error||'Could not cancel.'));
}

async function sendMsg() {
  var msg = document.getElementById('contactMsg');
  var st  = document.getElementById('msgStatus');
  if (!msg||!msg.value.trim()) return;
  st.style.display='block'; st.style.color='var(--muted)'; st.textContent='Sending...';
  try {
    var r = await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json','x-session-token':token},body:JSON.stringify({message:msg.value.trim()})});
    var d = await r.json();
    if(d.ok){st.style.color='var(--green)';st.textContent='Sent! We will get back to you soon.';msg.value='';}
    else throw new Error(d.error);
  } catch(e){st.style.color='var(--red)';st.textContent='Could not send. Please email us directly.';}
}

// ── Load ──────────────────────────────────────────────────────────────────────
fetch('/api/dashboard',{headers:{'x-session-token':token}})
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d.ok){logout();return;}
    return fetch('/api/me',{headers:{'x-session-token':token}}).then(function(r){return r.json();}).then(function(me){
      dashData = d;
      dashData.user = me;
      buildReportView(dashData);
      buildAccountView(dashData);
      showView('report');
    });
  })
  .catch(function(){logout();});
</script>
