<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin - PlateIQ</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1a1a;--muted:#6b6b6b;--bg:#faf8f4;--card:#fff;--amber:#e8a020;--amber-p:#fef3dc;--green:#16a34a;--green-p:#f0fdf4;--red:#dc2626;--red-p:#fef2f2;--border:rgba(26,26,26,.1);--border-m:rgba(26,26,26,.16);--r:8px;--r-lg:16px;--serif:"DM Serif Display",Georgia,serif;--sans:"Plus Jakarta Sans",system-ui,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.6;}
nav{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;background:var(--ink);color:#fff;}
.brand{font-family:var(--serif);font-size:18px;color:#fff;}
.brand span{color:var(--amber);}
.nav-em{font-size:12px;color:rgba(255,255,255,.5);}
.wrap{max-width:1100px;margin:0 auto;padding:32px 24px 80px;}
/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:32px;}
.stat-card{background:var(--card);border:1px solid var(--border-m);border-radius:var(--r-lg);padding:16px;}
.stat-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.stat-value{font-family:var(--serif);font-size:28px;color:var(--ink);}
.stat-value.green{color:var(--green);}
.stat-value.amber{color:var(--amber);}
/* Table */
.table-card{background:var(--card);border:1px solid var(--border-m);border-radius:var(--r-lg);overflow:hidden;margin-bottom:24px;}
.table-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.table-title{font-family:var(--serif);font-size:17px;color:var(--ink);}
table{width:100%;border-collapse:collapse;}
th{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 16px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg);}
td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg);}
.plan-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--amber-p);color:var(--amber);}
.plan-pill.none{background:var(--bg);color:var(--muted);}
.plan-pill.active{background:var(--green-p);color:var(--green);}
.btn-xs{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:var(--r);border:1.5px solid var(--border-m);background:var(--card);color:var(--ink);cursor:pointer;margin-right:4px;}
.btn-xs.danger{border-color:rgba(220,38,38,.3);color:var(--red);}
.btn-xs.primary{background:var(--ink);border-color:var(--ink);color:#fff;}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:24px;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:var(--r-lg);padding:28px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;}
.modal h3{font-family:var(--serif);font-size:20px;margin-bottom:16px;}
.modal-close{float:right;font-size:20px;cursor:pointer;color:var(--muted);border:none;background:none;}
.f-group{margin-bottom:12px;}
.f-group label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px;}
.f-group input,.f-group select,.f-group textarea{font-family:var(--sans);font-size:13.5px;color:var(--ink);background:var(--bg);border:1.5px solid var(--border-m);border-radius:var(--r);padding:9px 12px;outline:none;width:100%;transition:border-color .15s;}
.f-group input:focus{border-color:var(--amber);background:#fff;}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-primary{font-family:var(--sans);font-size:13px;font-weight:700;background:var(--ink);color:#fff;border:none;border-radius:var(--r);padding:10px 20px;cursor:pointer;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.msg{font-size:13px;margin-top:8px;padding:8px 12px;border-radius:var(--r);}
.msg.ok{background:var(--green-p);color:var(--green);}
.msg.err{background:var(--red-p);color:var(--red);}
.cred-block{background:var(--bg);border-radius:var(--r);padding:12px;margin-bottom:8px;}
.cred-platform{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--amber);margin-bottom:6px;}
.cred-line{font-size:12px;color:var(--muted);margin-bottom:2px;}
.cred-line strong{color:var(--ink);}
@media(max-width:700px){.stats-grid{grid-template-columns:repeat(2,1fr);}table{display:block;overflow-x:auto;}.f-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<nav>
  <div class="brand">Plate<span>IQ</span> <span class="nav-em">Admin</span></div>
  <div class="nav-em" id="navNote">Enter admin password to access</div>
</nav>

<!-- Password gate -->
<div id="pwGate" style="max-width:400px;margin:80px auto;padding:0 24px;">
  <div style="background:var(--card);border:1px solid var(--border-m);border-radius:var(--r-lg);padding:28px;">
    <div style="font-family:var(--serif);font-size:20px;margin-bottom:16px;">Admin access</div>
    <div class="f-group"><input type="password" id="adminPw" placeholder="Admin password"></div>
    <button class="btn-primary" onclick="unlockAdmin()" style="width:100%;">Unlock</button>
    <div class="msg err" id="pwErr" style="display:none;">Incorrect password.</div>
  </div>
</div>

<div id="adminPanel" class="wrap" style="display:none;">

  <!-- Stats -->
  <div class="stats-grid" id="statsGrid"></div>

  <!-- Clients table -->
  <div class="table-card">
    <div class="table-header">
      <div class="table-title">Clients</div>
      <div style="font-size:12px;color:var(--muted);" id="clientCount"></div>
    </div>
    <table>
      <thead><tr>
        <th>Restaurant</th><th>Email</th><th>Plan</th><th>Status</th><th>Joined</th><th>Weeks</th><th>Actions</th>
      </tr></thead>
      <tbody id="clientsBody"></tbody>
    </table>
  </div>
</div>

<!-- Enter data modal -->
<div class="modal-overlay" id="dataModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('dataModal')">&times;</button>
    <h3>Enter weekly data</h3>
    <div id="dataModalRestaurant" style="font-size:13px;color:var(--muted);margin-bottom:16px;"></div>
    <input type="hidden" id="dm-restId">
    <div class="f-group"><label>Week ending (Sunday) *</label><input type="date" id="dm-week"></div>
    <div class="f-row">
      <div class="f-group"><label>Orders *</label><input type="number" id="dm-orders" placeholder="e.g. 312"></div>
      <div class="f-group"><label>Revenue (&pound;) *</label><input type="number" step="0.01" id="dm-revenue" placeholder="e.g. 7580.00"></div>
    </div>
    <div class="f-row">
      <div class="f-group"><label>Avg order value (&pound;)</label><input type="number" step="0.01" id="dm-aov" placeholder="e.g. 24.30"></div>
      <div class="f-group"><label>Current rating</label><input type="number" step="0.1" min="1" max="5" id="dm-rating" placeholder="e.g. 4.6"></div>
    </div>
    <div class="f-row">
      <div class="f-group"><label>New reviews this week</label><input type="number" id="dm-reviews" placeholder="e.g. 8"></div>
      <div class="f-group"><label>Notes for Claude</label><input type="text" id="dm-notes" placeholder="e.g. ran 20% off promo"></div>
    </div>
    <button class="btn-primary" onclick="saveData()" id="saveDataBtn">Save data</button>
    <div id="saveDataMsg" style="display:none;"></div>
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
      <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px;">After saving data, generate the AI report:</div>
      <button class="btn-primary" onclick="generateReport()" id="genReportBtn" style="background:var(--amber);color:var(--ink);">Generate AI report</button>
      <div id="genReportMsg" style="display:none;margin-top:8px;"></div>
    </div>
  </div>
</div>

<!-- Client detail modal -->
<div class="modal-overlay" id="clientModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('clientModal')">&times;</button>
    <div id="clientModalContent"></div>
  </div>
</div>

<script>
var adminPw = '';

function unlockAdmin() {
  var pw = document.getElementById('adminPw').value;
  var errEl = document.getElementById('pwErr');
  errEl.style.display='none';
  errEl.textContent='Incorrect password.';

  // First check the server is alive
  fetch('/health')
    .then(function(r){ return r.json(); })
    .then(function(h){
      var dbNote = h.db ? '' : ' (No DB — running in demo mode)';
      // Now try admin auth
      return fetch('/api/admin/stats', {headers:{'x-admin-password':pw}})
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (!d.ok) {
            errEl.textContent = d.error || 'Incorrect password.';
            errEl.style.display='block';
            return;
          }
          adminPw = pw;
          document.getElementById('pwGate').style.display='none';
          document.getElementById('adminPanel').style.display='block';
          document.getElementById('navNote').textContent='Admin' + dbNote;
          if (d.warning) document.getElementById('navNote').textContent += ' ⚠ ' + d.warning;
          renderStats(d.stats);
          loadClients();
        });
    })
    .catch(function(e){
      errEl.textContent = 'Cannot reach server: ' + e.message;
      errEl.style.display='block';
    });
}

function renderStats(s) {
  document.getElementById('statsGrid').innerHTML =
    '<div class="stat-card"><div class="stat-label">Active clients</div><div class="stat-value green">'+s.active_clients+'</div></div>' +
    '<div class="stat-card"><div class="stat-label">MRR</div><div class="stat-value amber">&pound;'+Number(s.mrr).toLocaleString()+'</div></div>' +
    '<div class="stat-card"><div class="stat-label">Starter</div><div class="stat-value">'+s.starter_count+'</div></div>' +
    '<div class="stat-card"><div class="stat-label">Growth</div><div class="stat-value">'+s.growth_count+'</div></div>' +
    '<div class="stat-card"><div class="stat-label">Partner</div><div class="stat-value">'+s.partner_count+'</div></div>';
}

function loadClients() {
  fetch('/api/admin/clients', {headers:{'x-admin-password':adminPw}})
    .then(function(r){return r.json();})
    .then(function(d){
      document.getElementById('clientCount').textContent = d.clients.length + ' clients';
      var tbody = document.getElementById('clientsBody');
      tbody.innerHTML = d.clients.map(function(c){
        var joined = new Date(c.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
        var planClass = c.plan_status==='active' ? 'active' : c.plan==='none'||!c.plan ? 'none' : '';
        return '<tr>' +
          '<td><strong>'+(c.name||'(no restaurant)')+'</strong><br><span style="font-size:11px;color:var(--muted);">'+(c.postcode||'')+'</span></td>' +
          '<td>'+c.email+'</td>' +
          '<td><span class="plan-pill">'+( c.plan||'none')+'</span></td>' +
          '<td><span class="plan-pill '+planClass+'">'+(c.plan_status||'inactive')+'</span></td>' +
          '<td>'+joined+'</td>' +
          '<td>'+(c.weeks_logged||0)+' weeks</td>' +
          '<td>' +
            (c.restaurant_id ? '<button class="btn-xs primary" onclick="openDataModal(''+c.restaurant_id+'',''+c.name+'')">+ Data</button>' : '') +
            '<button class="btn-xs" onclick="viewClient(''+c.email+'')">View</button>' +
            '<button class="btn-xs danger" onclick="deleteClient(''+c.email+'')">Delete</button>' +
          '</td></tr>';
      }).join('') || '<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--muted);">No clients yet</td></tr>';
    });
}

function openDataModal(restId, restName) {
  document.getElementById('dm-restId').value = restId;
  document.getElementById('dataModalRestaurant').textContent = restName;
  // Default week ending to last Sunday
  var d = new Date();
  d.setDate(d.getDate() - d.getDay());
  document.getElementById('dm-week').value = d.toISOString().split('T')[0];
  ['dm-orders','dm-revenue','dm-aov','dm-rating','dm-reviews','dm-notes'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('saveDataMsg').style.display='none';
  document.getElementById('genReportMsg').style.display='none';
  document.getElementById('dataModal').classList.add('open');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

async function saveData() {
  var btn = document.getElementById('saveDataBtn');
  var msg = document.getElementById('saveDataMsg');
  btn.disabled=true; btn.textContent='Saving...'; msg.style.display='none';
  var res = await fetch('/api/admin/weekly-data', {
    method:'POST', headers:{'Content-Type':'application/json','x-admin-password':adminPw},
    body: JSON.stringify({
      restaurantId: document.getElementById('dm-restId').value,
      weekEnding:   document.getElementById('dm-week').value,
      orders:       document.getElementById('dm-orders').value,
      revenue:      document.getElementById('dm-revenue').value,
      aov:          document.getElementById('dm-aov').value,
      rating:       document.getElementById('dm-rating').value,
      newReviews:   document.getElementById('dm-reviews').value,
      notes:        document.getElementById('dm-notes').value
    })
  });
  var d = await res.json();
  msg.className = 'msg '+(d.ok?'ok':'err');
  msg.textContent = d.ok ? 'Data saved successfully.' : (d.error||'Error saving data.');
  msg.style.display='block';
  btn.disabled=false; btn.textContent='Save data';
  if (d.ok) loadClients();
}

async function generateReport() {
  var btn = document.getElementById('genReportBtn');
  var msg = document.getElementById('genReportMsg');
  btn.disabled=true; btn.textContent='Generating...'; msg.style.display='none';
  var res = await fetch('/api/admin/generate-report', {
    method:'POST', headers:{'Content-Type':'application/json','x-admin-password':adminPw},
    body: JSON.stringify({
      restaurantId: document.getElementById('dm-restId').value,
      weekEnding:   document.getElementById('dm-week').value
    })
  });
  var d = await res.json();
  msg.className = 'msg '+(d.ok?'ok':'err');
  msg.textContent = d.ok ? 'Report generated and emailed to client.' : (d.error||'Error generating report.');
  msg.style.display='block';
  btn.disabled=false; btn.textContent='Generate AI report';
}

async function viewClient(email) {
  var res = await fetch('/api/admin/client/'+encodeURIComponent(email), {headers:{'x-admin-password':adminPw}});
  var d = await res.json();
  var c = d;
  var credsHtml = (c.credentials||[]).map(function(cr){
    return '<div class="cred-block"><div class="cred-platform">'+cr.platform+'</div>' +
      '<div class="cred-line"><strong>Email:</strong> '+(cr.login_email||'-')+'</div>' +
      '<div class="cred-line"><strong>Password:</strong> '+(cr.login_password||'-')+'</div>' +
      (cr.notes?'<div class="cred-line"><strong>Notes:</strong> '+cr.notes+'</div>':'') +
    '</div>';
  }).join('') || '<p style="font-size:13px;color:var(--muted);">No credentials stored.</p>';

  var histHtml = (c.history||[]).slice(0,5).map(function(h){
    return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;">' +
      '<span>w/e '+new Date(h.week_ending).toLocaleDateString('en-GB')+'</span>' +
      '<span>'+h.orders+' orders &middot; &pound;'+Number(h.revenue).toFixed(2)+'</span>' +
      '<span style="color:'+(h.report_data?'var(--green)':'var(--muted)')+';">'+(h.report_data?'Report ready':'No report')+'</span>' +
    '</div>';
  }).join('') || '<p style="font-size:13px;color:var(--muted);">No data yet.</p>';

  document.getElementById('clientModalContent').innerHTML =
    '<h3>'+(c.restaurant?c.restaurant.name:email)+'</h3>' +
    '<div style="font-size:12.5px;color:var(--muted);margin-bottom:16px;">'+email+' &middot; Plan: '+(c.user&&c.user.plan||'none')+'</div>' +
    '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;">Platform credentials</div>' +
    credsHtml +
    '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px;">Recent history</div>' +
    histHtml;
  document.getElementById('clientModal').classList.add('open');
}

async function deleteClient(email) {
  if (!confirm('Permanently delete '+email+'? This cannot be undone.')) return;
  var res = await fetch('/api/admin/client/'+encodeURIComponent(email), {method:'DELETE',headers:{'x-admin-password':adminPw}});
  var d = await res.json();
  if (d.ok) { loadClients(); alert('Account deleted.'); }
  else alert(d.error||'Error deleting account.');
}

document.addEventListener('keydown',function(e){if(e.key==='Enter'&&document.getElementById('pwGate').style.display!=='none')unlockAdmin();});
document.querySelectorAll('.modal-overlay').forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)m.classList.remove('open');});});
</script>
</body>
</html>
